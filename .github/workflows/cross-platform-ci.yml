name: Miselium cross-platform application and PostgreSQL CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "platforms/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements/**"
      - "alembic/**"
      - "alembic.ini"
      - "main.py"
      - ".github/workflows/cross-platform-ci.yml"
      - "database/postgresql/**"
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "platforms/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "requirements/**"
      - "alembic/**"
      - "alembic.ini"
      - "main.py"
      - ".github/workflows/**"
      - "database/postgresql/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MISELIUM_JWT_SECRET: ci-only-secret-value-not-for-production-123456
      MISELIUM_ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install client and backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements/server.txt
      - name: Lint cross-platform and M7-M10 backend, including inventory posting, reversal, and production consumption and batch locking
        run: ruff check --ignore I001 src/app/backend/m9_identity.py src/app/backend/m9_api.py src/app/backend/security/m9_tokens.py src/app/backend/services/authentication.py src/app/backend/services/tenant_lifecycle.py src/app/backend/services/invitations.py src/app/backend/services/membership_admin.py src/app/backend/services/tenant_roles.py src/app/backend/services/inventory.py src/app/backend/services/production_lifecycle.py tests/backend/test_m10_production_lifecycle_postgres.py tests/backend/test_m9_tenant_roles_postgres.py tests/backend/test_m9_invitations_postgres.py tests/backend/test_m9_membership_admin_postgres.py tests/backend/test_m9_identity_adapter.py tests/backend/test_m9_authentication_service.py tests/backend/test_m9_api.py tests/backend/test_m9_api_postgres.py tests/backend/test_m9_tenant_lifecycle_postgres.py tests/backend/test_m9_invitation_role_boundary_postgres.py tests/backend/test_m10_inventory_services_postgres.py tests/backend/test_m10_production_lifecycle_postgres.py
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src main.py
      - name: Validate Android manifest
        if: runner.os == 'Linux'
        run: python scripts/check_android_manifest.py

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miselium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d miselium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/miselium_test
      MISELIUM_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/miselium_test
      MISELIUM_DATABASE_URL: postgresql+psycopg://miselium_app:ci-miselium-runtime-password@localhost:5432/miselium_test
      MISELIUM_JWT_SECRET: ci-only-secret-value-not-for-production-123456
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical PostgreSQL migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0001_platform_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0002_production_inventory.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0003_tenant_rbac_invitation_roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0004_authenticated_membership_discovery.sql
      - name: Prepare restricted RLS runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE miselium_app LOGIN PASSWORD 'ci-miselium-runtime-password' NOSUPERUSER NOBYPASSRLS"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO miselium_app"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT ON locations, inventory_items TO miselium_app"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/roles/0001_miselium_app_auth_read.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0005_global_registration_tenant_lifecycle.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0006_tenant_invitation_lifecycle.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0007_tenant_membership_administration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0008_tenant_role_permission_administration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0009_invitation_location_lookup_qualification.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0010_invitation_role_permission_boundary.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0011_m10_inventory_application_services.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0012_modular_settings_and_machines.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0013_m10_1_2_production_stage_records.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0014_m10_1_2_1_press_output_integrity.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/migrations/0015_m10_1_3_production_batch_transitions.sql
      - name: Run M9 platform RLS smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0001_platform_foundation_smoke.sql
      - name: Run M10 production and inventory RLS smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0002_production_inventory_smoke.sql
      - name: Run M11 modular Settings and machine smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0012_modular_settings_smoke.sql
      - name: Run M10.1.2 production stage schema smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0013_m10_1_2_production_stage_records_smoke.sql
      - name: Run M10.1.2.1 press output integrity smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0014_m10_1_2_1_press_output_integrity_smoke.sql
      - name: Run M10.1.3 lifecycle schema smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0015_m10_1_3_production_batch_transitions_smoke.sql
      - name: Run M9 tenant RBAC and invitation smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0003_tenant_rbac_invitation_roles_smoke.sql
      - name: Run M9 authenticated membership discovery smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/postgresql/tests/0004_authenticated_membership_discovery_smoke.sql

      - name: Install Python API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/server.txt pytest pytest-asyncio httpx
      - name: Exercise M9 API and M10 services with restricted PostgreSQL role
        run: python -m pytest -q tests/backend/test_m9_api_postgres.py tests/backend/test_m9_tenant_lifecycle_postgres.py tests/backend/test_m9_invitations_postgres.py tests/backend/test_m9_membership_admin_postgres.py tests/backend/test_m9_tenant_roles_postgres.py tests/backend/test_m9_invitation_role_boundary_postgres.py tests/backend/test_m10_inventory_services_postgres.py
