name: Android toolchain readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install PySide6 and inspect Android deploy tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6==6.12.0
          pyside6-android-deploy --help
      - name: Validate Android manifest and permission declarations
        run: python scripts/check_android_manifest.py
