name: CI

on:
  push:
    branches: [main, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MISELIUM_JWT_SECRET: ci-only-secret-value-not-for-production-123456
      MISELIUM_ENVIRONMENT: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r requirements/server.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src main.py

  desktop-package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/package.txt
      - name: Build desktop application
        run: python scripts/package_desktop.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: miselium-desktop-${{ runner.os }}
          path: dist/
          if-no-files-found: error
